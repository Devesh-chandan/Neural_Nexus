<title>Neural Nexus Walkthrough</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a dark "screen" stage on the left with a camera that zooms into the screenshots,
   a caption panel and chapter list on the right; stacks to one column on phones. */
:root {
  --bg: #f2f3f8;
  --surface: #ffffff;
  --surface-2: #e9ebf5;
  --ink: #0f1220;
  --muted: #565c76;
  --line: #d8dbea;
  --accent: #4b50d9;
  --accent-ink: #ffffff;
  --accent-text: #3a3fc2;
  --stage: #06070a;
  --stage-line: #1d2030;
  --ring: #a9aeff;
  --tag-bg: #5a60ee;
  --tag-ink: #ffffff;
  --dim: #000000;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0c11; --surface: #14161e; --surface-2: #1c1f2b; --ink: #eceef7; --muted: #9aa0b8;
    --line: #272a38; --accent: #5a60ee; --accent-ink: #ffffff; --accent-text: #a3a8ff; --stage-line: #272a38;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0c11; --surface: #14161e; --surface-2: #1c1f2b; --ink: #eceef7; --muted: #9aa0b8;
  --line: #272a38; --accent: #5a60ee; --accent-ink: #ffffff; --accent-text: #a3a8ff; --stage-line: #272a38;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }

.shell { max-width: 1320px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 40px; min-height: 100%; background: var(--bg); }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; margin-bottom: 18px; }
.top h1 { margin: 0; font: 700 clamp(22px, 3vw, 30px)/1.1 var(--font-display); letter-spacing: -0.02em; text-wrap: balance; }
.top h1 span { color: var(--muted); font-weight: 600; }
.top p { margin: 0; color: var(--muted); font-size: 14px; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.player { min-width: 0; display: grid; gap: 12px; }

.stage { position: relative; aspect-ratio: 16 / 10; max-width: 100%; overflow: hidden; border-radius: 14px; background: var(--stage); border: 1px solid var(--stage-line);
  background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.06) 1px, transparent 0); background-size: 22px 22px; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; opacity: 0; visibility: hidden; z-index: 1;
  transition: transform 1.15s cubic-bezier(.65,.02,.22,1), opacity .5s ease, visibility 0s linear .5s; will-change: transform; }
.world.active { opacity: 1; visibility: visible; z-index: 2; transition: transform 1.15s cubic-bezier(.65,.02,.22,1), opacity .5s ease, visibility 0s; }
.world.nt, .world.nt.active { transition: none; }
.world img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; box-shadow: 0 0 0 1px rgba(255,255,255,.07); }
.world svg.fx { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.world .dim { opacity: 0; transition: opacity .5s ease; }
.world .rings { opacity: 0; transition: opacity .15s ease; }
.world.lit .dim { opacity: .64; }
.world.lit .rings { opacity: 1; transition: opacity .45s ease .1s; }
.ring-glow { fill: none; stroke: var(--ring); opacity: .28; }
.ring-line { fill: none; stroke: var(--ring); }
.tag { position: absolute; left: 0; top: 0; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s ease; padding-bottom: 6px; padding-top: 6px; }
.tag.up { transform-origin: 0 100%; transform: translateY(-100%) scale(var(--inv, 1)); }
.tag.down { transform-origin: 0 0; transform: scale(var(--inv, 1)); }
.tag span { display: inline-block; background: var(--tag-bg); color: var(--tag-ink); font: 600 13px/1 var(--font-body); padding: 6px 10px; border-radius: 7px; box-shadow: 0 2px 10px rgba(0,0,0,.45); }
.world.lit .tag { opacity: 1; transition: opacity .45s ease .25s; }
.cursor { position: absolute; left: 0; top: 0; width: 24px; height: 24px; transform-origin: 0 0; transform: scale(var(--inv, 1)); opacity: 0; pointer-events: none;
  transition: left 1s cubic-bezier(.5,0,.2,1), top 1s cubic-bezier(.5,0,.2,1), opacity .3s ease; z-index: 3; }
.cursor.on { opacity: 1; }
.cursor.snap { transition: opacity .3s ease; }
.cursor svg { display: block; width: 24px; height: 24px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.7)); }
.cursor::after { content: ""; position: absolute; left: -14px; top: -14px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; opacity: 0; transform: scale(.3); }
.cursor.click::after { animation: ripple .7s ease-out; }
@keyframes ripple { 0% { opacity: .9; transform: scale(.3); } 100% { opacity: 0; transform: scale(1.6); } }

.pill { position: absolute; left: 12px; top: 12px; z-index: 5; display: flex; align-items: center; gap: 8px; max-width: calc(100% - 24px); padding: 6px 11px; border-radius: 999px;
  background: rgba(10,11,16,.78); border: 1px solid rgba(255,255,255,.12); color: #e9ebf5; font: 500 12px/1 var(--font-mono); backdrop-filter: blur(6px); }
.pill b { font-weight: 500; color: #fff; }
.pill i { font-style: normal; color: #a9aeff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-body); font-weight: 600; font-size: 12px; }
.start { position: absolute; z-index: 6; left: 50%; bottom: 16px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 999px;
  padding: 12px 22px 12px 16px; background: var(--accent); color: var(--accent-ink); font: 600 15px/1 var(--font-body); box-shadow: 0 8px 28px rgba(0,0,0,.5); transition: transform .15s ease, background .15s; }
.start:hover { transform: translateX(-50%) translateY(-1px); }
.start svg { width: 20px; height: 20px; }
.start[hidden] { display: none; }

.controls { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.btns { display: flex; align-items: center; gap: 6px; }
.ib { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); transition: background .15s, border-color .15s; }
.ib:hover { border-color: var(--accent-text); }
.ib svg { width: 18px; height: 18px; fill: currentColor; }
.ib.play { width: 46px; height: 46px; background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.ib.play svg { width: 20px; height: 20px; }
.ib:disabled { opacity: .4; cursor: default; }
.track { position: relative; flex: 1 1 200px; min-width: 120px; height: 28px; cursor: pointer; touch-action: none; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 11px; height: 6px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); }
.fill { position: absolute; left: 0; top: 11px; height: 6px; width: 0; border-radius: 6px; background: var(--accent); }
.tick { position: absolute; top: 8px; width: 2px; height: 12px; background: var(--surface); border-radius: 1px; }
.knob { position: absolute; top: 7px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--accent-text); box-shadow: 0 0 0 3px var(--surface); }
.opts { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.opts select { height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 8px; }
.opts .ib { width: 34px; height: 34px; border-radius: 8px; }
.hint { margin: 0; color: var(--muted); font-size: 13px; }
.hint kbd { font: 500 12px var(--font-mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }

.side { min-width: 0; display: grid; gap: 14px; }
.caption { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 20px 22px; }
.eyebrow { margin: 0 0 10px; font: 500 12px/1.3 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent-text); }
.caption h2 { margin: 0 0 10px; font: 700 24px/1.15 var(--font-display); letter-spacing: -0.015em; text-wrap: balance; }
.caption p.body { margin: 0; color: var(--ink); font-size: 16px; line-height: 1.55; max-width: 65ch; }
.caption.swap > * { animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.chapters { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px; display: grid; gap: 2px; }
.chapters h3 { margin: 6px 10px 6px; font: 500 12px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.ch { border-radius: 10px; }
.ch > button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; border: 0; background: transparent; padding: 9px 10px; border-radius: 10px; font-weight: 600; }
.ch > button:hover { background: var(--surface-2); }
.ch .n { flex: none; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); font: 500 12px var(--font-mono); }
.ch .c { margin-left: auto; color: var(--muted); font: 500 12px var(--font-mono); }
.ch.active > button { background: var(--surface-2); }
.ch.active .n { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.ch ol { display: none; margin: 2px 0 6px 44px; padding: 0 6px 0 0; list-style: none; }
.ch.active ol { display: grid; gap: 1px; }
.ch ol button { width: 100%; text-align: left; border: 0; background: transparent; padding: 5px 8px; border-radius: 7px; font-size: 14px; color: var(--muted); }
.ch ol button:hover { color: var(--ink); background: var(--surface-2); }
.ch ol button.cur { color: var(--ink); font-weight: 600; background: var(--surface-2); box-shadow: inset 3px 0 0 var(--accent); }

.shell:fullscreen { overflow: auto; padding-block: 20px; }

@media (max-width: 960px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .opts { margin-left: 0; }
}
@media (max-width: 520px) {
  .shell { padding-inline: 16px; }
  .caption { padding: 16px; }
  .caption h2 { font-size: 21px; }
  .caption p.body { font-size: 15px; }
  .controls { gap: 8px; }
  .track { order: 3; flex-basis: 100%; }
  .hint { display: none; }
  .tag span { font-size: 12px; padding: 5px 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .world, .world.active, .cursor, .world .dim, .world .rings, .tag { transition: none !important; }
  .caption.swap > * { animation: none; }
  .cursor.click::after { animation: none; }
}
</style>

<div class="shell" id="shell">
  <header class="top">
    <h1>Neural Nexus <span>walkthrough</span></h1>
    <p id="meta">Loading steps</p>
  </header>

  <div class="main">
    <section class="player" aria-label="Walkthrough player">
      <div class="stage" id="stage">
        <div id="worlds"></div>
        <div class="pill" aria-hidden="true"><b id="pillN">01 / 01</b><i id="pillC"></i></div>
        <button class="start" id="start" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
          <span id="startLabel">Play walkthrough</span>
        </button>
      </div>

      <div class="controls">
        <div class="btns">
          <button class="ib" id="prev" type="button" aria-label="Previous step" title="Previous step (Left arrow)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5.5v13a1 1 0 0 1-1.55.83L9 13.7a1 1 0 0 1 0-1.66l9.45-5.7A1 1 0 0 1 20 5.5z"/></svg></button>
          <button class="ib play" id="play" type="button" aria-label="Play" title="Play or pause (Space)"></button>
          <button class="ib" id="next" type="button" aria-label="Next step" title="Next step (Right arrow)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5.5v13a1 1 0 0 0 1.55.83L15 13.7a1 1 0 0 0 0-1.66L5.55 6.34A1 1 0 0 0 4 5.5z"/></svg></button>
        </div>
        <div class="track" id="track" role="slider" tabindex="0" aria-label="Walkthrough progress" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1">
          <div class="fill" id="fill"></div>
          <div class="knob" id="knob"></div>
        </div>
        <div class="opts">
          <label class="sr" for="speed" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Playback speed</label>
          <select id="speed" aria-label="Playback speed">
            <option value="0.75">0.75x</option>
            <option value="1" selected>1x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
          </select>
          <button class="ib" id="fs" type="button" aria-label="Full screen" title="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v2H6v4H4zM14 4h6v6h-2V6h-4zM4 14h2v4h4v2H4zM18 14h2v6h-6v-2h4z"/></svg></button>
        </div>
      </div>
      <p class="hint"><kbd>Space</kbd> play or pause &nbsp; <kbd>&larr;</kbd> <kbd>&rarr;</kbd> change step &nbsp; Click the bar to jump. All names and figures in the screenshots are demo data.</p>
    </section>

    <aside class="side">
      <article class="caption" id="caption" aria-live="off">
        <p class="eyebrow" id="capEyebrow"></p>
        <h2 id="capTitle"></h2>
        <p class="body" id="capBody"></p>
      </article>
      <nav class="chapters" id="chapters" aria-label="Chapters"><h3>Chapters</h3></nav>
    </aside>
  </div>
</div>

  ];

  /* ---------- flatten steps ---------- */
  var steps = [], chStart = [];
  CH.forEach(function (c, ci) {
    chStart.push(steps.length);
    c.s.forEach(function (a) {
      var k = IMG[a[0]].k || 1;
      function sc(r) { return r.map(function (v, i) { return i < 4 ? Math.round(v * k) : v; }); }
      var words = (a[4] || "").split(/\s+/).length;
      steps.push({
        img: a[0], f: sc(a[1]), hl: a[2].map(sc), title: a[3], text: a[4], pt: a[5] ? [Math.round(a[5][0] * k), Math.round(a[5][1] * k)] : null,
        ch: ci, dur: Math.min(9, Math.max(5, 2.5 + words / 4.5))
      });
    });
  });
  var N = steps.length;
  var total = steps.reduce(function (t, s) { return t + s.dur; }, 0);
  document.getElementById("meta").textContent = N + " steps in " + CH.length + " chapters, about " + Math.round(total / 60) + " minutes on autoplay";

  /* ---------- elements ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var stage = $("stage"), worldsEl = $("worlds"), startBtn = $("start"), playBtn = $("play"), prevBtn = $("prev"), nextBtn = $("next");
  var track = $("track"), fill = $("fill"), knob = $("knob"), speedSel = $("speed"), caption = $("caption");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var SVGNS = "http://www.w3.org/2000/svg";

  var ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
  var ICON_REPLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>';

  /* ---------- worlds ---------- */
  var worlds = {}, uid = 0;
  Object.keys(IMG).forEach(function (key) {
    var im = IMG[key], id = "m" + (uid++);
    var el = document.createElement("div");
    el.className = "world nt";
    el.innerHTML =
      '<img alt="" draggable="false" src="' + im.f + '">' +
      '<svg class="fx" viewBox="0 0 ' + im.w + " " + im.h + '" preserveAspectRatio="none" aria-hidden="true">' +
      '<defs><mask id="' + id + '" maskUnits="userSpaceOnUse" x="0" y="0" width="' + im.w + '" height="' + im.h + '"><rect width="' + im.w + '" height="' + im.h + '" fill="#fff"/><g class="holes"></g></mask></defs>' +
      '<rect class="dim" width="' + im.w + '" height="' + im.h + '" fill="var(--dim)" mask="url(#' + id + ')"/>' +
      '<g class="rings"></g></svg>' +
      '<div class="tags"></div>' +
      '<div class="cursor snap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 2l17 8.2-7.3 2.1L9.6 20z" fill="#fff" stroke="#0b0c11" stroke-width="1.4" stroke-linejoin="round"/></svg></div>';
    worldsEl.appendChild(el);
    worlds[key] = { el: el, im: im, holes: el.querySelector(".holes"), rings: el.querySelector(".rings"), tags: el.querySelector(".tags"),
      cursor: el.querySelector(".cursor"), cam: null, timers: [], cursorOn: false };
  });

  /* ---------- camera ---------- */
  function camera(im, f) {
    var W = stage.clientWidth, H = stage.clientHeight, u = W / im.w, s;
    if (f[2] >= im.w * 0.98) { s = Math.min(W / (f[2] * u), H / (f[3] * u)); }
    else { s = Math.min(W * 0.93 / (f[2] * u), H * 0.93 / (f[3] * u)); }
    s = Math.min(s, 1.5 / u);
    var cw = W * s, ch = W * im.h / im.w * s;
    var tx = W / 2 - (f[0] + f[2] / 2) * u * s, ty = H / 2 - (f[1] + f[3] / 2) * u * s;
    tx = cw >= W ? Math.min(0, Math.max(W - cw, tx)) : (W - cw) / 2;
    ty = ch >= H ? Math.min(0, Math.max(H - ch, ty)) : (H - ch) / 2;
    return { s: s, tx: tx, ty: ty, u: u };
  }
  function sizeWorld(w) {
    var W = stage.clientWidth;
    w.el.style.width = W + "px";
    w.el.style.height = (W * w.im.h / w.im.w) + "px";
  }
  function applyCam(w, st) {
    sizeWorld(w);
    var c = camera(w.im, st.f);
    w.cam = c;
    w.el.style.transform = "translate(" + c.tx + "px," + c.ty + "px) scale(" + c.s + ")";
    w.el.style.setProperty("--inv", String(1 / c.s));
    return c;
  }
  function clearTimers(w) { w.timers.forEach(clearTimeout); w.timers = []; }
  function later(w, fn, ms) { w.timers.push(setTimeout(fn, ms)); }

  function drawOverlays(w, st) {
    var c = w.cam, im = w.im, px = c.u * c.s, pad = 4 / px, sw = 3 / px;
    var holes = "", rings = "", tags = "";
    st.hl.forEach(function (r) {
      var x = r[0] - pad, y = r[1] - pad, ww = r[2] + 2 * pad, hh = r[3] + 2 * pad, rx = 6 / px;
      holes += '<rect x="' + x + '" y="' + y + '" width="' + ww + '" height="' + hh + '" rx="' + rx + '" fill="#000"/>';
      rings += '<rect class="ring-glow" x="' + x + '" y="' + y + '" width="' + ww + '" height="' + hh + '" rx="' + rx + '" stroke-width="' + (sw * 3.4) + '"/>' +
               '<rect class="ring-line" x="' + x + '" y="' + y + '" width="' + ww + '" height="' + hh + '" rx="' + rx + '" stroke-width="' + sw + '"/>';
      if (r[4]) {
        var below = y < im.h * 0.05;
        var ax = x, ay = below ? y + hh : y;
        tags += '<div class="tag ' + (below ? "down" : "up") + '" style="left:' + (ax / im.w * 100) + '%;top:' + (ay / im.h * 100) + '%"><span>' + r[4] + "</span></div>";
      }
    });
    w.holes.innerHTML = holes;
    w.rings.innerHTML = rings;
    w.tags.innerHTML = tags;
  }

  function placeCursor(w, st, animate) {
    var cur = w.cursor, im = w.im;
    function pos(p) { cur.style.left = (p[0] / im.w * 100) + "%"; cur.style.top = (p[1] / im.h * 100) + "%"; }
    cur.classList.remove("click");
    if (!st.pt) { cur.classList.remove("on"); w.cursorOn = false; return; }
    if (!w.cursorOn || !animate) {
      cur.classList.add("snap");
      pos([Math.max(0, st.pt[0] - 110), Math.min(im.h, st.pt[1] + 90)]);
      void cur.offsetWidth;
    }
    cur.classList.add("on");
    w.cursorOn = true;
    later(w, function () {
      cur.classList.remove("snap");
      pos(st.pt);
    }, animate ? 500 : 750);
    later(w, function () { cur.classList.add("click"); }, animate ? 1600 : 1850);
  }

  /* ---------- player state ---------- */
  var cur = -1, playing = false, started = false, elapsed = 0, last = 0, raf = 0;

  function setPlayIcon() {
    var done = !playing && cur === N - 1 && elapsed >= steps[cur].dur - 0.01;
    playBtn.innerHTML = playing ? ICON_PAUSE : (done ? ICON_REPLAY : ICON_PLAY);
    playBtn.setAttribute("aria-label", playing ? "Pause" : (done ? "Replay" : "Play"));
    document.getElementById("startLabel").textContent = done ? "Replay walkthrough" : "Play walkthrough";
  }
  function updateStartVisibility() {
    var done = !playing && cur === N - 1 && elapsed >= steps[cur].dur - 0.01;
    startBtn.hidden = !(( !started && !playing) || done);
  }

  function show(i, opts) {
    opts = opts || {};
    i = Math.max(0, Math.min(N - 1, i));
    var prev = cur >= 0 ? steps[cur] : null, st = steps[i];
    var w = worlds[st.img];
    var same = prev && prev.img === st.img && !opts.instant;
    clearTimers(w);
    if (!same) {
      Object.keys(worlds).forEach(function (k) {
        if (k !== st.img) { var o = worlds[k]; clearTimers(o); o.el.classList.remove("active", "lit"); o.cursor.classList.remove("on"); o.cursorOn = false; }
      });
      w.el.classList.add("nt");
      w.el.classList.remove("lit");
      applyCam(w, st);
      drawOverlays(w, st);
      void w.el.offsetWidth;
      w.el.classList.remove("nt");
      w.el.classList.add("active");
      later(w, function () { w.el.classList.add("lit"); }, reduce ? 0 : 650);
      placeCursor(w, st, false);
    } else {
      w.el.classList.remove("lit");
      applyCam(w, st);
      drawOverlays(w, st);
      later(w, function () { w.el.classList.add("lit"); }, reduce ? 0 : 800);
      placeCursor(w, st, true);
    }
    cur = i;
    elapsed = 0;
    updateUi();
  }

  function updateUi() {
    var st = steps[cur], c = CH[st.ch];
    $("pillN").textContent = pad2(cur + 1) + " / " + pad2(N);
    $("pillC").textContent = c.t;
    $("capEyebrow").textContent = "Chapter " + (st.ch + 1) + " of " + CH.length + "  /  " + c.t;
    $("capTitle").textContent = st.title;
    $("capBody").textContent = st.text;
    caption.classList.remove("swap");
    void caption.offsetWidth;
    if (!reduce) caption.classList.add("swap");
    prevBtn.disabled = cur === 0;
    track.setAttribute("aria-valuenow", String(cur + 1));
    track.setAttribute("aria-valuemax", String(N));
    track.setAttribute("aria-valuetext", "Step " + (cur + 1) + " of " + N + ": " + st.title);
    var items = document.querySelectorAll(".ch");
    for (var a = 0; a < items.length; a++) items[a].classList.toggle("active", a === st.ch);
    var btns = document.querySelectorAll(".ch ol button");
    for (var b = 0; b < btns.length; b++) btns[b].classList.toggle("cur", b === cur);
    renderProgress();
    setPlayIcon();
    updateStartVisibility();
  }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  function renderProgress() {
    var frac = (cur + Math.min(1, elapsed / steps[cur].dur)) / N;
    fill.style.width = (frac * 100) + "%";
    knob.style.left = (frac * 100) + "%";
  }

  function frame(t) {
    if (!playing) return;
    var dt = Math.min(0.1, (t - last) / 1000);
    last = t;
    elapsed += dt * parseFloat(speedSel.value);
    if (elapsed >= steps[cur].dur) {
      if (cur < N - 1) { show(cur + 1); }
      else { elapsed = steps[cur].dur; playing = false; renderProgress(); setPlayIcon(); updateStartVisibility(); return; }
    } else { renderProgress(); }
    raf = requestAnimationFrame(frame);
  }
  function play() {
    if (cur === N - 1 && elapsed >= steps[cur].dur - 0.01) show(0);
    started = true; playing = true; last = performance.now();
    cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
    setPlayIcon(); updateStartVisibility();
  }
  function pause() { playing = false; cancelAnimationFrame(raf); setPlayIcon(); updateStartVisibility(); }
  function toggle() { playing ? pause() : play(); }
  function go(i) { started = true; show(i); if (playing) { last = performance.now(); } updateStartVisibility(); }

  /* ---------- chapters nav ---------- */
  var nav = $("chapters");
  CH.forEach(function (c, ci) {
    var d = document.createElement("div");
    d.className = "ch";
    var head = document.createElement("button");
    head.type = "button";
    head.innerHTML = '<span class="n">' + (ci + 1) + "</span><span>" + c.t + '</span><span class="c">' + c.s.length + "</span>";
    head.addEventListener("click", function () { go(chStart[ci]); });
    d.appendChild(head);
    var ol = document.createElement("ol");
    c.s.forEach(function (_, si) {
      var li = document.createElement("li"), b = document.createElement("button");
      b.type = "button"; b.textContent = steps[chStart[ci] + si].title;
      b.addEventListener("click", function () { go(chStart[ci] + si); });
      li.appendChild(b); ol.appendChild(li);
    });
    d.appendChild(ol);
    nav.appendChild(d);
  });

  /* ---------- progress ticks + seeking ---------- */
  chStart.forEach(function (s, i) {
    if (i === 0) return;
    var t = document.createElement("div");
    t.className = "tick"; t.style.left = (s / N * 100) + "%";
    track.appendChild(t);
  });
  function seek(ev) {
    var r = track.getBoundingClientRect();
    var f = Math.max(0, Math.min(0.9999, (ev.clientX - r.left) / r.width));
    go(Math.floor(f * N));
  }
  var dragging = false;
  track.addEventListener("pointerdown", function (e) { dragging = true; try { track.setPointerCapture(e.pointerId); } catch (x) {} seek(e); });
  track.addEventListener("pointermove", function (e) { if (dragging) seek(e); });
  track.addEventListener("pointerup", function () { dragging = false; });
  track.addEventListener("pointercancel", function () { dragging = false; });

  /* ---------- controls ---------- */
  startBtn.addEventListener("click", play);
  playBtn.addEventListener("click", toggle);
  prevBtn.addEventListener("click", function () { go(cur - 1); });
  nextBtn.addEventListener("click", function () { go(cur + 1); });
  speedSel.addEventListener("change", function () { last = performance.now(); });
  $("fs").addEventListener("click", function () {
    var sh = $("shell");
    try {
      if (document.fullscreenElement) { document.exitFullscreen(); }
      else if (sh.requestFullscreen) { var p = sh.requestFullscreen(); if (p && p.catch) p.catch(function () {}); }
    } catch (e) {}
  });
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target, inCtl = t && t.closest && t.closest("button, select, [role=slider]");
    if (e.key === "ArrowRight") { if (t && t.tagName === "SELECT") return; e.preventDefault(); go(cur + 1); }
    else if (e.key === "ArrowLeft") { if (t && t.tagName === "SELECT") return; e.preventDefault(); go(cur - 1); }
    else if ((e.key === " " || e.key === "k") && !inCtl) { e.preventDefault(); toggle(); }
    else if (e.key === "Home" && t === track) { e.preventDefault(); go(0); }
    else if (e.key === "End" && t === track) { e.preventDefault(); go(N - 1); }
  });
  var rz = 0;
  window.addEventListener("resize", function () {
    cancelAnimationFrame(rz);
    rz = requestAnimationFrame(function () {
      var st = steps[cur], w = worlds[st.img];
      w.el.classList.add("nt");
      applyCam(w, st);
      drawOverlays(w, st);
      void w.el.offsetWidth;
      w.el.classList.remove("nt");
    });
  });

  /* ---------- start ---------- */
  var first = 0;
  try { var m = /^#step-(\d+)$/.exec(location.hash || ""); if (m) first = Math.max(0, Math.min(N - 1, parseInt(m[1], 10) - 1)); } catch (e) {}
  show(first, { instant: true });
  if (first > 0) { started = true; updateStartVisibility(); }
})();
