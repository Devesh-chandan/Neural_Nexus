# Underlyings whitelist
# Each entry defines a supported asset that can be used as a product underlying.
# Tickers are yfinance symbols.
# dividend_yield: illustrative annual yield (fraction) for the indicative option pricer; update from
# an issuer/market-data feed for real use. Historical prices are split-adjusted, NOT dividend-adjusted.

